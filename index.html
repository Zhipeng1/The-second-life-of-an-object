<style>
:root{--text:#f5f5f7;--sec:#a1a1a6;--ter:#73737a;--green:#9fd0a0;--amber:#e8c789;--red:#e0806c}

.card{width:min(100%,410px);max-height:calc(100dvh - 28px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;

.go.l{background:rgba(159,208,160,.16);color:#a9d8a6}.go.r{background:rgba(232,199,137,.16);color:#efd39b}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.cell{position:relative;aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);display:grid;place-items:center;overflow:hidden;cursor:pointer}

.info b{color:#f2f2f4;font-size:14px}
.progress{height:6px;border-radius:9px;background:rgba(255,255,255,.07);margin:10px 0 2px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#9fd0a0,#e8c789);border-radius:9px}
.shareImg{width:100%;border-radius:20px;display:block;margin:6px 0 10px;box-shadow:0 12px 40px rgba(0,0,0,.45);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto;touch-action:auto}
.tip{font-size:11px;color:#8e8e93;margin:4px 0 10px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-top:1px solid rgba(255,255,255,.07);font-size:14px;font-weight:600;color:#d8d8dc}
.sw{width:50px;height:30px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;border:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:#7fbf83}.sw.on::after{transform:translateX(20px)}
.mini{font-size:10.5px;color:#6d6d73;margin-top:12px;line-height:1.6}
#toastDom{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);z-index:9;
  padding:10px 16px;border-radius:14px;background:rgba(30,30,32,.95);border:1px solid rgba(255,255,255,.1);font-size:13px;font-weight:650;
  opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
#toastDom.show{opacity:1}
@media (max-width:350px){.card{padding:22px 16px 16px;border-radius:24px}.btn{height:46px;min-width:100px}.rank{width:70px;height:70px;font-size:42px}}
@media (max-height:640px){.heroArt{height:84px}.card h1{font-size:40px}.ruleRow{margin:10px 0}}
</style>

<body>
<div id="app">
  <canvas id="game" aria-label="第二次生命：可持续发展一指小游戏"></canvas>
  <button class="hudBtn" id="pauseBtn" aria-label="暂停"><i></i></button>
  <div id="overlay" class="show"><div class="card" id="panel"></div></div>
  <div id="toastDom"></div>
</div>
<script>
(() => {
"use strict";
/* ============================================================
   基础工具
   ============================================================ */
const canvas=document.getElementById("game"),mainCtx=canvas.getContext("2d");
let ctx=mainCtx;
const overlay=document.getElementById("overlay"),panel=document.getElementById("panel"),pauseBtn=document.getElementById("pauseBtn");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,easeOut=t=>1-Math.pow(1-t,3),easeBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const FONT='-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif';
const font=(w,s)=>`${w} ${s}px ${FONT}`;
const store={
  get(k,d){try{const v=localStorage.getItem("sl2_"+k);return v===null?d:JSON.parse(v)}catch(_){return d}},
  set(k,v){try{localStorage.setItem("sl2_"+k,JSON.stringify(v))}catch(_){}}
};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rng=Math.random;
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(rng()*a.length)];
function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function dailyNo(){const d=new Date();d.setHours(0,0,0,0);return Math.floor((d-new Date(2026,9,1))/864e5)+1}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let W=390,H=844,DPR=1,SAFE_TOP=0,SAFE_BOTTOM=0,L={};
function readSafeAreas(){
  const p=document.createElement("div");
  p.style.cssText="position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)";
  document.body.appendChild(p);const cs=getComputedStyle(p);SAFE_TOP=parseFloat(cs.paddingTop)||0;SAFE_BOTTOM=parseFloat(cs.paddingBottom)||0;p.remove();
}
function layout(){
  const S=clamp(Math.min(H/800,W/390),.74,1.06);
  const hudTop=SAFE_TOP+10,hudBottom=hudTop+94;
  const zoneH=Math.round(70*Math.min(1,S+.05)),zoneY=H-Math.max(SAFE_BOTTOM,8)-12-zoneH;
  const spawnY=hudBottom+96*S,missY=zoneY-100*S;
  L={S,hudTop,hudBottom,zoneH,zoneY,spawnY,missY,beltTop:hudBottom+4,beltBottom:zoneY-8};
}
function resize(){
  const r=canvas.getBoundingClientRect();DPR=Math.min(2.5,window.devicePixelRatio||1);
  W=Math.max(300,r.width);H=Math.max(480,r.height);
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  mainCtx.setTransform(DPR,0,0,DPR,0,0);readSafeAreas();layout();
}
addEventListener("resize",resize,{passive:true});
addEventListener("orientationchange",()=>setTimeout(resize,250));
resize();

/* ============================================================
   音频：音效 + 轻量生成式背景音乐
   ============================================================ */
let audioCtx=null,master=null,musicBus=null,muted=store.get("mute",false),musicOn=store.get("music",true),hapticOn=store.get("haptic",true);
function ensureAudio(){
  try{
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      master=audioCtx.createGain();master.gain.value=muted?0:1;master.connect(audioCtx.destination);
      musicBus=audioCtx.createGain();musicBus.gain.value=musicOn?1:0;
      const lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2400;musicBus.connect(lp).connect(master);
    }
    if(audioCtx.state!=="running"&&audioCtx.resume)audioCtx.resume();
  }catch(_){}
}
function setMuted(m){muted=m;store.set("mute",m);if(master)master.gain.value=m?0:1}
function setMusic(m){musicOn=m;store.set("music",m);if(musicBus)musicBus.gain.value=m?1:0}
function tone(freq=300,d=.05,type="triangle",gain=.02,slide=0,when=0,bus){
  if(!audioCtx||muted)return;
  try{const t=audioCtx.currentTime+when,o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(bus||master);o.start(t);o.stop(t+d+.02)}catch(_){}
}
function noise(d=.08,gain=.03,freq=1200){
  if(!audioCtx||muted)return;
  try{const len=Math.floor(audioCtx.sampleRate*d),b=audioCtx.createBuffer(1,len,audioCtx.sampleRate),ch=b.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);
    const s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
    s.buffer=b;f.type="bandpass";f.frequency.value=freq;g.gain.value=gain;s.connect(f).connect(g).connect(master);s.start()}catch(_){}
}
const PENTA=[0,2,4,7,9,12,14,16,19,21];
const note=n=>220*Math.pow(2,n/12);
function sfx(n){
  const lift=Math.min(streak,16);
  if(n==="good"){tone(note(PENTA[lift%10]+12),.07,"triangle",.05,0);tone(note(PENTA[(lift+2)%10]+12),.09,"sine",.035,0,.045);noise(.05,.02,3000)}
  if(n==="open"){tone(note(PENTA[lift%10]+7),.08,"sine",.05);tone(note(PENTA[(lift+1)%10]+12),.1,"sine",.04,0,.05)}
  if(n==="bad"){tone(140,.16,"square",.035,-60);tone(98,.22,"sawtooth",.02,-30,.04);noise(.12,.05,400)}
  if(n==="miss"){tone(180,.18,"triangle",.04,-90)}
  if(n==="scan"){tone(520,.06,"sine",.03,300);tone(880,.08,"sine",.025,200,.07)}
  if(n==="hold"){tone(300,.05,"sine",.012,60)}
  if(n==="flow"){[0,4,7,12].forEach((s,i)=>tone(note(12+s),.14,"triangle",.045,0,i*.055))}
  if(n==="event"){tone(196,.25,"sawtooth",.025,0);tone(233,.25,"sawtooth",.02,0,.12)}
  if(n==="choose"){tone(330,.12,"triangle",.04,120)}
  if(n==="tick"){tone(1200,.03,"square",.012)}
  if(n==="count"){tone(660,.09,"triangle",.04)}
  if(n==="go"){tone(880,.18,"triangle",.05,220);tone(1320,.2,"sine",.03,0,.05)}
  if(n==="end"){[0,4,7,11,14].forEach((s,i)=>tone(note(s+3),.35,"triangle",.04,0,i*.09))}
  if(n==="medal"){tone(1046,.15,"sine",.04);tone(1568,.2,"sine",.03,0,.08)}
  if(n==="whoosh"){noise(.14,.04,1800)}
  if(n==="ui"){tone(600,.04,"sine",.02,80)}
}
function vibe(p){if(!hapticOn)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}}
/* 背景音乐：随 FLOW 变得更密 */
const music={on:false,next:0,step:0,timer:null};
function musicStart(){
  ensureAudio();if(!audioCtx||music.on)return;music.on=true;music.next=audioCtx.currentTime+.08;music.step=0;
  music.timer=setInterval(musicTick,30);
}
function musicStop(){music.on=false;clearInterval(music.timer);music.timer=null}
const CHORDS=[[0,4,7],[-3,0,4],[-7,-3,0],[-5,-1,2]];
function musicTick(){
  if(!music.on||!audioCtx||muted||!musicOn)return;
  const prog=clamp(elapsed/SHIFT,0,1),bpm=96+prog*28+(rushing()?14:0),stepDur=60/bpm/2;
  while(music.next<audioCtx.currentTime+.12){
    const s=music.step,bar=Math.floor(s/8)%4,ch=CHORDS[bar],when=music.next-audioCtx.currentTime;

function applyEffects(e){if(!e)return;env=clamp(env+(e.env||0),0,100);people=clamp(people+(e.people||0),0,100);trust=clamp(trust+(e.trust||0),0,100)}
function burst(x,y,good,n){
  n=n||(good?14:9);
  const cols=good?(multiplier()>=3?["#f1d08a","#ffe6a8","#fff3d0"]:["#d4b266","#a9d8a6","#efe0b4"]):["#a75b4d","#7d4a3e"];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=rand(60,220);particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rand(.35,.7),max:.7,size:rand(2,5),col:cols[i%cols.length]})}
}
function cardScreenX(){return W/2+dragX}
function resolve(dir){
  if(state!=="playing"||!current||fly)return;
  if(tut){tutResolve(dir);return}
  if(current.event){resolveEvent(dir);return}
  const open=current.mode==="choice",good=open||dir===current.preferred,mult=multiplier(),x=cardScreenX(),y=currentY;
  const travel=clamp((currentY-L.spawnY)/(L.missY-L.spawnY),0,1),quick=travel<.35;
  if(good){
    streak++;maxStreak=Math.max(maxStreak,streak);correct++;
    const m2=multiplier();
    let pts=(open?80:100)*m2+(current.inspected?30:0)+(quick?20:0);
    if(rushing())pts*=2;
    score+=pts;applyEffects(current[dir]);skill=clamp(skill+.08,-1,1);
    pops.push({x,y:y-70*L.S,text:"+"+pts,sub:quick?"迅速":current.inspected?"细心":open?(dir==="right"?"再用更暖心":"两边都对"):"",life:.9,max:.9,good:true,big:m2>=3});
    if(!collection.has(current.id)){collection.add(current.id);newUnlocks.push(current.id);store.set("seen",[...collection])}
    if(streak===5||streak===10||streak===16){sfx("flow");vibe([10,30,15]);goldFlash=.5;rings.push({x:W/2,y:L.hudTop+28,r:10,life:.6,max:.6});showBanner(`FLOW ×${m2}`,streak===16?"满级！窗外的城市在发光":"连对加倍得分",1.2)}
    else{sfx(open?"open":"good");vibe(m2>=3?12:7)}
    burst(dir==="left"?W*.18:W*.82,y,true);
  }else{
    const best=current.preferred;
    streak=0;wrong++;score=Math.max(0,score-50);applyEffects(current[dir]);skill=clamp(skill-.25,-1,1);addTime(-2);
    mistakes.push({id:current.id,type:current.type,name:current.name,flaw:current.flaw,mark:current.mark,go:best,why:current.why});
    coach={go:best,name:current.name,why:current.why,life:2.4,max:2.4};
    pops.push({x,y:y-70*L.S,text:"-50",sub:"判断失误",life:.9,max:.9,good:false});
    sfx("bad");vibe([30,40,30]);shake=9;flash=.16;flashColor="174,76,62";
    burst(x,y,false);
  }
  swipeFx.push({dir,y,life:.28,max:.28,good});
  handled++;fly=dir;flyT=flyTotal=good?.24:.34;sfx("whoosh");
}
function resolveEvent(dir){
  const e=current[dir];applyEffects(e);
  if(e.score){score+=e.score;pops.push({x:cardScreenX(),y:currentY-80,text:"+"+e.score,sub:"短期效率",life:1.1,max:1.1,good:true})}
  if(e.timeCost)addTime(-e.timeCost);

  showBanner(dir==="left"?current.leftLabel:current.rightLabel,dir==="left"?current.leftText:current.rightText,1.6);
  if(dir==="left"){goldFlash=.25;skill=clamp(skill+.15,-1,1)}else{skill=clamp(skill-.1,-1,1)}
  sfx("choose");vibe(14);handled++;fly=dir;flyT=flyTotal=.34;
  swipeFx.push({dir,y:currentY,life:.3,max:.3,good:true});
}
function missCurrent(){
  if(!current||fly)return;
  if(current.event){
    const e=current.right;applyEffects(e);score+=e.score||0;if(e.pressure)pressureT=e.pressure;
    eventLog.push({id:current.id,name:current.name,dir:"right",care:false,auto:true});

  }else{

}
function inspectCurrent(){

  tut.t+=dt;tut.wrongT=Math.max(0,tut.wrongT-dt);

/* ============================================================
   流程
   ============================================================ */
function showHud(v){pauseBtn.classList.toggle("show",v)}
function startRun(m){
  ensureAudio();sfx("ui");mode=m||"classic";
  if(!store.get("tut",false)){startTutorial();overlay.classList.remove("show");return}
  resetRun();overlay.classList.remove("show");beginCountdown();

function beginCountdown(){
  state="countdown";countT=2.4;lastTickSec=99;current=null;showHud(true);musicStart();
  overlay.classList.remove("show");
}
function update(dt){
  worldTime+=dt;shake=Math.max(0,shake-30*dt);flash=Math.max(0,flash-dt);goldFlash=Math.max(0,goldFlash-dt);spawnT=Math.max(0,spawnT-dt);
  factoryMood+=(clamp(skill+(env+people+trust-150)/150,-1,1)-factoryMood)*(1-Math.pow(.25,dt));
  skill*=Math.pow(.92,dt);
  for(const p of pops){p.life-=dt;p.y-=38*dt}pops=pops.filter(p=>p.life>0);
  for(const p of timePops){p.life-=dt}timePops=timePops.filter(p=>p.life>0);
  for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.vx*=Math.pow(.3,dt)}particles=particles.filter(p=>p.life>0);
  for(const s of swipeFx)s.life-=dt;swipeFx=swipeFx.filter(s=>s.life>0);
  for(const r of rings){r.life-=dt;r.r+=260*dt}rings=rings.filter(r=>r.life>0);
  if(coach){coach.life-=dt;if(coach.life<=0)coach=null}
  if(banner){banner.life-=dt;if(banner.life<=0)banner=null}
  dragVis+=(dragX-dragVis)*(1-Math.pow(.0001,dt));
  if(!pointer.down&&!fly)dragX*=Math.pow(.0008,dt);
  if(state==="countdown"){
    const before=Math.ceil(countT/.8);countT-=dt;const after=Math.ceil(countT/.8);
    if(after!==before&&after>0)sfx("count");
    if(countT<=0){state="playing";sfx("go");vibe(15);spawnCurrent()}
    return;
  }
  if(state==="ending"){endT-=dt;if(endT<=0)showResult();return}
  if(state!=="playing")return;
  if(tut){tutUpdate(dt);return}
  timeLeft-=dt;elapsed=SHIFT-timeLeft;pressureT=Math.max(0,pressureT-dt);
  const sec=Math.ceil(timeLeft);
  if(sec<=RUSH&&sec!==lastTickSec){lastTickSec=sec;if(sec>0){sfx("tick");if(sec===RUSH){showBanner("最后冲刺 · 得分 ×2","冲！",1.4);vibe([15,30,15])}}}
  if(timeLeft<=0){timeLeft=0;endShift();return}
  for(const p of eventPlan)if(!p.done&&elapsed>=p.at&&!pendingEvent){pendingEvent=p.ev;p.done=true}
  if(scanT>0)scanT-=dt;
  if(fly){flyT-=dt;if(flyT<=0)spawnCurrent();return}
  const prog=clamp(elapsed/SHIFT,0,1),dur=lerp(5.4,2.55,Math.pow(prog,.85));
  const speed=(L.missY-L.spawnY)/dur;
  const pressure=pressureT>0?1.3:1,scanSlow=scanT>0?.35:1,eventSlow=current&&current.event?.42:1;
  const holdSlow=pointer.down&&!pointer.moved?.5:1,flowBoost=1+Math.min(streak,20)*.008;
  currentY+=speed*pressure*scanSlow*eventSlow*holdSlow*flowBoost*dt;
  if(currentY>L.missY)missCurrent();
}
function endShift(){
  state="ending";endT=1.3;sfx("end");vibe([20,40,60]);musicStop();showHud(false);
  clearLong();pointer.down=false;
}

function computeResult(){
  const total=correct+wrong+missed,acc=total?correct/total:0;
  const medals=[];
  if(env>=70)medals.push({k:"E",name:"绿色勋章",desc:"环境 ≥ 70",pts:300});
  if(people>=70)medals.push({k:"S",name:"人本勋章",desc:"社会 ≥ 70",pts:300});
  if(trust>=70)medals.push({k:"G",name:"诚信勋章",desc:"治理 ≥ 70",pts:300});
  if(wrong+missed===0&&total>=12)medals.push({k:"P",name:"零失误",desc:"全班无失误",pts:500});
  const bonus=medals.reduce((a,m)=>a+m.pts,0),final=score+bonus;
  const esgAvg=(env+people+trust)/3;
  let rank="D";
  if(final>=7000&&acc>=.9&&medals.length>=3)rank="S";else if(final>=5000&&acc>=.8)rank="A";else if(final>=3200)rank="B";else if(final>=1600)rank="C";
  const rankName={S:"夜班传奇",A:"城市守护者",B:"熟练分拣员",C:"见习夜班员",D:"刚来的新人"}[rank];
  return{base:score,bonus,final,medals,acc,total,rank,rankName,esgAvg,city:citySummary()};
}
function citySummary(){
  const avg=(env+people+trust)/3;let title="仍在生长的城市",tag="🌱";
  if(env>=70&&people>=70&&trust>=70){title="会呼吸的城市";tag="🌳"}
  else if(env>=72&&people<55){title="绿色但匆忙的城市";tag="🍃"}
  else if(people>=72&&trust>=65){title="彼此照顾的城市";tag="🏮"}
  else if(env>=70&&trust>=70){title="清澈透明的城市";tag="💧"}
  else if(trust<40){title="灯很亮，但标签太多";tag="🏷"}
  else if(people<40){title="运行很快，却有些疲惫";tag="🌫"}
  else if(env<40){title="繁忙而沉重的城市";tag="🏭"}
  else if(avg>=62){title="越来越平衡的城市";tag="⚖️"}
  const l1=env>=65?"很多东西没有被浪费。":env<45?"资源流转得很快，但代价也留在了远处。":"资源大多找到了合适的去处。";
  const l2=people>=65?"这里的人被认真地考虑过。":people<45?"这座城市跑得很快，但它也需要休息。":"效率和人的感受仍在拉扯。";
  const l3=trust>=65?"你愿意花一点时间确认事实。":trust<45?"有些标签，你选择直接相信。":"你偶尔停下来确认，也偶尔相信经验。";
  return{title,tag,l1,l2,l3};
}

  const p=clientPoint(e);if(p.y<L.hudBottom-10)return;
  pointer.down=true;pointer.id=e.pointerId;pointer.sx=pointer.x=pointer.lastX=p.x;pointer.sy=pointer.y=p.y;pointer.moved=false;pointer.t0=pointer.lastT=performance.now();pointer.vx=0;

  if(!inZone&&!current.event&&!current.inspected){pointer.longTimer=setTimeout(()=>{if(pointer.down&&!pointer.moved)inspectCurrent()},380);setTimeout(()=>{if(pointer.down&&!pointer.moved&&current&&!current.inspected&&!current.event)sfx("hold")},90)}
});
canvas.addEventListener("pointermove",e=>{
  if(!pointer.down||e.pointerId!==pointer.id)return;
  const p=clientPoint(e),now=performance.now();
  const dtm=Math.max(1,now-pointer.lastT);pointer.vx=pointer.vx*.4+((p.x-pointer.lastX)/dtm)*.6;pointer.lastX=p.x;pointer.lastT=now;
  pointer.x=p.x;pointer.y=p.y;const dx=p.x-pointer.sx,dy=p.y-pointer.sy;
  if(!pointer.moved&&Math.hypot(dx,dy)>10){pointer.moved=true;clearLong()}

function endPointer(e){
  if(!pointer.down||e.pointerId!==pointer.id)return;
  clearLong();const dx=pointer.x-pointer.sx,dy=pointer.y-pointer.sy,dt=performance.now()-pointer.t0;
  pointer.down=false;pointer.id=null;
  if(state!=="playing"||!current||fly){dragX=0;return}
  const th=Math.max(56,W*.16),flick=Math.abs(pointer.vx)>.55&&Math.abs(dx)>28;
  if((Math.abs(dx)>th||flick)&&Math.abs(dx)>Math.abs(dy)*.6){resolve(dx<0?"left":"right");return}
  if(!pointer.moved&&dt<300&&pointer.sy>=L.zoneY-4){resolve(pointer.sx<W/2?"left":"right");return}

}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",e=>{if(pointer.down){clearLong();pointer.down=false;pointer.id=null}});
document.addEventListener("contextmenu",e=>{if(!e.target.classList||!e.target.classList.contains("shareImg"))e.preventDefault()});
document.addEventListener("gesturestart",e=>e.preventDefault());
pauseBtn.addEventListener("click",e=>{e.stopPropagation();sfx("ui");showPause()});
document.addEventListener("visibilitychange",()=>{if(document.hidden){if(state==="playing"||state==="countdown")showPause();musicStop();if(audioCtx&&audioCtx.suspend)audioCtx.suspend().catch(()=>{})}else if(audioCtx&&audioCtx.resume&&state==="playing")audioCtx.resume()});
addEventListener("keydown",e=>{
  if(state==="menu"&&e.code==="Enter"){startRun("classic");return}
  if(e.code==="Escape"||e.code==="KeyP"){if(state==="playing")showPause();return}
  if(state!=="playing")return;
  if(e.code==="ArrowLeft"||e.code==="KeyA")resolve("left");
  if(e.code==="ArrowRight"||e.code==="KeyD")resolve("right");
  if(e.code==="Space"||e.code==="KeyI"||e.code==="ArrowDown"){e.preventDefault();inspectCurrent()}
});

/* ============================================================
   主循环
   ============================================================ */
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!state.startsWith("paused")){acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}}else acc=0;
  render();requestAnimationFrame(loop);
}
parseChallenge();showMenu();requestAnimationFrame(loop);
// 测试钩子（不影响游戏）
window.__SL={get state(){return state},get current(){return current},get score(){return score},get timeLeft(){return timeLeft},get esg(){return[env,people,trust]},resolve,inspectCurrent,get L(){return L},get tut(){return tut},computeResult,get streak(){return streak}};
})();
